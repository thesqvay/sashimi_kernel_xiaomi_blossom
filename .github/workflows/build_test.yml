name: Build Test 2

on: workflow_dispatch

permissions:
  contents: read

env:
  KERNEL_ARCH: arm64
  KERNEL_DEFCONFIG: blossom_defconfig
  CLANG_DIR: /tmp/proton-clang
  CCACHE_DIR: /home/runner/.ccache
  OPT_FLAGS: -O2
  REMOVE_FLAGS: -O3 -funsafe-math-optimizations
  LINK_FLAGS: --lto-O2
  WARN_FLAGS: -Wno-unknown-warning-option -Wno-error=implicit-function-declaration -Wno-error=implicit-int -Wno-error=int-conversion -Wno-error=incompatible-function-pointer-types
  OPP_TABLE: drivers/misc/mediatek/base/power/cpufreq_v1/src/mach/mt6765/mtk_cpufreq_opp_table.h
  BUILD_TAG: O2-configs

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: KernelSU
        run: |
          set -euo pipefail
          git submodule update --init --recursive
          git -C KernelSU fetch --tags --force
          git -C KernelSU checkout v4.2.0-rc3
          test -f drivers/kernelsu/Kconfig
          git -C KernelSU rev-parse --short HEAD

      - name: Dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
          bc bison flex build-essential libssl-dev libelf-dev cpio \
          git zip curl wget ca-certificates xz-utils zstd ccache python3 \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Neutron Clang
        run: |
          set -euo pipefail

          mkdir -p "$CLANG_DIR"
          cd "$CLANG_DIR"

          curl -fsSLO https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman
          chmod +x antman

          ./antman -S=latest

          test -x bin/clang
          test -x bin/ld.lld

          echo "== Neutron Clang =="
          ./bin/clang --version

          echo "== Neutron LLD =="
          ./bin/ld.lld --version

          echo "== LLVM tools =="
          ./bin/llvm-ar --version
          ./bin/llvm-nm --version

      - name: Cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-${{ github.ref_name }}-

      - name: Patch source
        run: |
          set -euo pipefail
          test -f "$OPP_TABLE"

          python3 << 'PYEOF'
          import os, re

          opp_file = os.environ["OPP_TABLE"]

          with open(opp_file, 'r') as f:
              content = f.read()

          new_freqs = [1800000, 1700000, 1600000, 1550000, 1500000]
          new_volts = [108750,  104375,  100625,  98750,   96875]

          for bin_name in ['C62', 'C62LY', 'C62D', 'C62DLY']:
              for i in range(5):
                  pattern = rf'(#define\s+CPU_DVFS_FREQ{i}_LL_{bin_name}\s+)\d+'
                  content = re.sub(pattern, rf'\g<1>{new_freqs[i]}', content)

                  pattern = rf'(#define\s+CPU_DVFS_VOLT{i}_VPROC_LL_{bin_name}\s+)\d+'
                  content = re.sub(pattern, rf'\g<1>{new_volts[i]}', content)

          with open(opp_file, 'w') as f:
              f.write(content)
          PYEOF

          grep -nE 'CPU_DVFS_FREQ[0-4]_LL_C62' "$OPP_TABLE" | head -20
          grep -nE 'CPU_DVFS_VOLT[0-4]_VPROC_LL_C62' "$OPP_TABLE" | head -20

          printf '\nLDFLAGS_vmlinux += %s\n' "$LINK_FLAGS" >> arch/arm64/Makefile

          tail -n 3 arch/arm64/Makefile

          N=$(grep -cE '^#define[[:space:]]+CPU_DVFS_FREQ0_LL_C62[A-Z]*[[:space:]]+1800000' "$OPP_TABLE" || true)
          test "$N" -ge 1

          sed -i '/^config ANDROID_DEFAULT_SETTING/,/^help/{
            /select IKCONFIG$/d
            /select IKCONFIG_PROC$/d
            /select STACKPROTECTOR$/d
            /select STACKPROTECTOR_STRONG$/d
            /select MAGIC_SYSRQ$/d
          }' drivers/misc/mediatek/Kconfig.default

          sed -i '/^config ARM64$/,/^endmenu/{
            /select FRAME_POINTER$/d
            /select REFCOUNT_FULL$/d
          }' arch/arm64/Kconfig

          sed -i 's/^\(\t\)default y if (DEBUG_INFO \&\& UML) || ARCH_WANT_FRAME_POINTERS$/\tdefault n/' lib/Kconfig.debug
          sed -i '/^config FRAME_POINTER$/,/^endmenu/{s/^\tdepends on DEBUG_KERNEL.*$/\tdepends on BROKEN/}' lib/Kconfig.debug

      - name: Build
        run: |
          set -euo pipefail
          exec > >(tee -a build.log) 2>&1

          export PATH="$CLANG_DIR/bin:$PATH"
          export ARCH="$KERNEL_ARCH"
          export CCACHE_COMPILERCHECK=content
          export CCACHE_CPP2=yes
          export CCACHE_SLOPPINESS=time_macros,locale,file_macro
          ccache -M 5G
          ccache -z

          TC=(
            CC="ccache clang"
            LD=ld.lld
            AR=llvm-ar
            NM=llvm-nm
            STRIP=llvm-strip
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            OBJSIZE=llvm-size
            READELF=llvm-readelf
            HOSTCC=clang
            HOSTCXX=clang++
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          )

          make O=out ARCH="$ARCH" "${TC[@]}" "$KERNEL_DEFCONFIG"
          test -s out/.config

          ./scripts/config --file out/.config \
            -d DEBUG_KERNEL \
            -d DEBUG_SPINLOCK -d DEBUG_MUTEXES -d DEBUG_RT_MUTEXES -d DEBUG_RWSEMS \
            -d DEBUG_WW_MUTEX_SLOWPATH -d DEBUG_LOCK_ALLOC -d LOCK_STAT -d PROVE_LOCKING \
            -d LOCKDEP -d DEBUG_LOCKDEP -d DEBUG_ATOMIC_SLEEP -d PROVE_RCU \
            -d PROVE_RAW_LOCK_NESTING -d DEBUG_SECTION_MISMATCH \
            -d DEBUG_PREEMPT -d DEBUG_VIRTUAL -d DEBUG_PI_LIST -d DEBUG_STACKOVERFLOW \
            -d DEBUG_TIMEKEEPING -d SCHED_STACK_END_CHECK -d WQ_WATCHDOG \
            -d DETECT_HUNG_TASK -d SOFTLOCKUP_DETECTOR -d HARDLOCKUP_DETECTOR \
            -d LOCKUP_DETECTOR -d BOOTPARAM_SOFTLOCKUP_PANIC -d BOOTPARAM_HARDLOCKUP_PANIC \
            -d BOOTPARAM_HUNG_TASK_PANIC -d PANIC_ON_OOPS \
            -d KASAN -d DEBUG_KMEMLEAK -d DEBUG_PAGEALLOC -d PAGE_POISONING -d PAGE_OWNER \
            -d PAGE_EXTENSION -d STACKDEPOT -d DEBUG_PAGE_REF \
            -d DEBUG_VM -d DEBUG_VM_VMACACHE -d DEBUG_VM_RB -d DEBUG_VM_PGFLAGS \
            -d DEBUG_STACK_USAGE -d DEBUG_PER_CPU_MAPS -d DEBUG_HIGHMEM \
            -d DEBUG_OBJECTS -d DEBUG_OBJECTS_FREE -d DEBUG_OBJECTS_TIMERS \
            -d DEBUG_OBJECTS_WORK -d DEBUG_OBJECTS_RCU_HEAD -d DEBUG_OBJECTS_PERCPU_COUNTER \
            -d DEBUG_NOTIFIERS -d DEBUG_LIST -d DEBUG_SG -d DEBUG_CREDENTIALS \
            -d DEBUG_MEMORY_INIT -d DEBUG_NOMMU_REGIONS \
            -d DMA_API_DEBUG -d DMA_API_DEBUG_SG \
            -d DEBUG_WX -d ARM64_PTDUMP_DEBUGFS -d ARM64_PTDUMP_CORE -d PID_IN_CONTEXTIDR \
            -d GENERIC_IRQ_DEBUGFS -d BLK_DEBUG_FS -d DEBUG_BLK_CGROUP \
            -d FAULT_INJECTION -d FAILSLAB -d FAIL_PAGE_ALLOC -d FAIL_MMC_REQUEST \
            -d FAIL_MAKE_REQUEST -d FAIL_IO_TIMEOUT -d FAIL_FUTEX -d FUNCTION_ERROR_INJECTION \
            -d KCOV -d KCOV_INSTRUMENT_ALL -d LATENCYTOP -d PROFILING -d OPROFILE \
            -d DEBUG_SHIRQ -d DEBUG_DRIVER -d DEBUG_DEVRES -d DEBUG_KOBJECT \
            -d DEBUG_KOBJECT_RELEASE -d DEBUG_TEST_DRIVER_REMOVE \
            -d DEBUG_FORCE_WEAK_PER_CPU -d DEBUG_WQ_FORCE_RR_CPU -d DEBUG_BLOCK_EXT_DEVT \
            -d DEBUG_RSEQ -d DEBUG_LOCKING_API_SELFTESTS -d DEBUG_RODATA_TEST \
            -d WARN_ALL_UNSEEDED_RANDOM -d BOOT_PRINTK_DELAY -d READABLE_ASM \
            -d FTRACE -d FUNCTION_TRACER -d FUNCTION_GRAPH_TRACER -d DYNAMIC_FTRACE \
            -d FUNCTION_PROFILER -d STACK_TRACER -d IRQSOFF_TRACER -d PREEMPT_TRACER \
            -d SCHED_TRACER -d HWLAT_TRACER -d BLK_DEV_IO_TRACE -d MMIOTRACE \
            -d FTRACE_SYSCALLS -d KPROBE_EVENTS -d UPROBE_EVENTS -d BPF_EVENTS \
            -d HIST_TRIGGERS -d TRACER_SNAPSHOT -d TRACER_SNAPSHOT_PER_CPU_SWAP \
            -d PREEMPTIRQ_EVENTS -d TRACE_PRINTK -e DISABLE_TRACE_PRINTK \
            -d TRACING_EVENTS_GPIO -d DMA_FENCE_TRACE -d TRACE_EVAL_MAP_FILE \
            -d FTRACE_STARTUP_TEST -d RING_BUFFER_STARTUP_TEST -d TRACEPOINT_BENCHMARK \
            -d PROFILE_ANNOTATED_BRANCHES -d PROFILE_ALL_BRANCHES -e BRANCH_PROFILE_NONE \
            -d TRACE_BRANCH_PROFILING -d BRANCH_TRACER -d SCHEDSTATS -d SCHED_DEBUG \
            -d PM_DEBUG -d PM_ADVANCED_DEBUG -d PM_SLEEP_DEBUG -d PM_TRACE \
            -d PM_TEST_SUSPEND -d DPM_WATCHDOG -d DYNAMIC_DEBUG -d DEBUG_BUGVERBOSE \
            -d SLUB_DEBUG -d SLUB_DEBUG_ON -d SLUB_STATS -d SLUB_MEMCG_SYSFS_ON \
            -d DEBUG_SLAB -d DEBUG_SLAB_LEAK -d SHRINKER_DEBUG \
            -d DEBUG_INFO -d DEBUG_INFO_DWARF4 -d DEBUG_INFO_REDUCED \
            -d DEBUG_INFO_SPLIT -d DEBUG_INFO_BTF -d GDB_SCRIPTS \
            -d MTK_MM_DEBUG -d MTK_ENG_BUILD -d MT_ENG_BUILD \
            -d MTK_AEE_FEATURE -d MTK_AEE_AED -d MTK_AEE_IPANIC \
            -d MTK_MET -d MTK_MET_CORE -d MTK_MET_PLF -d MTK_SPMTWAM -d MTK_ATF_LOGGER \
            -d MTK_SYSTRACKER_V2 -e MTK_SYSTRACKER_DISABLE \
            -d MTK_DRAM_LOG_STORE -d ZRAM_MEMORY_TRACKING \
            -d RUNTIME_TESTING_MENU -d LKDTM -d MEMTEST -d BUG_ON_DATA_CORRUPTION \
            -d INIT_ON_ALLOC_DEFAULT_ON -d INIT_ON_FREE_DEFAULT_ON \
            -e INIT_STACK_NONE -d INIT_STACK_ALL_ZERO -d INIT_STACK_ALL_PATTERN \
            -d GCC_PLUGIN_STRUCTLEAK_BYREF_ALL -d GCC_PLUGIN_STRUCTLEAK \
            -d HARDENED_USERCOPY_PAGESPAN -d FORTIFY_SOURCE \
            -d ARM64_SW_TTBR0_PAN \
            -d FRAME_POINTER -d ARCH_WANT_FRAME_POINTERS -d STACK_VALIDATION \
            -d KSM -d PSI -d PSI_DEFAULT_DISABLED \
            -d NUMA_BALANCING -d CGROUP_HUGETLB -d SCHED_AUTOGROUP \
            -d ZSWAP -d CLEANCACHE \
            -e MTK_SCHED_EXTENSION \
            -e CPU_IDLE_GOV_TEO \
            -e RCU_EXPERT -e RCU_NOCB_CPU -e RCU_FAST_NO_HZ -d RCU_BOOST \
            -d PREEMPT_NONE -d PREEMPT_VOLUNTARY -e PREEMPT \
            -d SCHED_GENTLE_FAIR_SLEEPERS -e SCHED_NEXT_BUDDY \
            -e HIGH_RES_TIMERS -e NO_HZ_IDLE -d NO_HZ_FULL -d HZ_PERIODIC \
            -d CONTEXT_TRACKING_FORCE \
            -d HZ_100 -d HZ_250 -d HZ_1000 -e HZ_300 \
            -e JUMP_LABEL -d STATIC_KEYS_SELFTEST \
            -d CC_OPTIMIZE_FOR_SIZE -e CC_OPTIMIZE_FOR_PERFORMANCE \
            -d THINLTO -e LTO_CLANG -d LTO_NONE \
            -d CFI_CLANG -d SHADOW_CALL_STACK -d LLVM_POLLY \
            -e IOSCHED_BFQ -e BFQ_GROUP_IOSCHED -e BFQ_DEFAULT \
            -d MQ_KYBER_DEFAULT -d MQ_DEADLINE_DEFAULT -d MQ_IOSCHED_KYBER \
            -e BLK_WBT -e BLK_WBT_MQ -e BLK_WBT_SQ \
            -d BLK_DEV_THROTTLING -d BLK_CGROUP_IOLATENCY -d BLK_SED_OPAL \
            -e TCP_CONG_BBR -e DEFAULT_BBR -d DEFAULT_CUBIC -d DEFAULT_RENO \
            -e NET_SCH_FQ_CODEL -e NET_SCH_FQ -e NET_SCH_CODEL -e NET_SCH_SFQ \
            -e NET_SCH_DEFAULT -e DEFAULT_FQ_CODEL -d DEFAULT_CAKE \
            -d KALLSYMS_ALL -e KALLSYMS_BASE_RELATIVE \
            -d PROC_KCORE -d PROC_VMCORE -d PROC_PAGE_MONITOR -e PROC_STRIPPED \
            -d ELF_CORE -d COREDUMP -d ALLOW_DEV_COREDUMP \
            -d MAGIC_SYSRQ -d MAGIC_SYSRQ_SERIAL -d SYSCTL_EXCEPTION_TRACE \
            -d UNUSED_SYMBOLS -e RELR -e LD_DEAD_CODE_DATA_ELIMINATION \
            -d UEVENT_HELPER -d SYSFS_SYSCALL -d SYSCTL_SYSCALL \
            -d SECURITY_DMESG_RESTRICT -d IO_STRICT_DEVMEM \
            -e BSD_PROCESS_ACCT -e TASK_DELAY_ACCT \
            -d CPU_ISOLATION \
            -e SUSPEND_SKIP_SYNC -e WQ_POWER_EFFICIENT_DEFAULT

          make O=out ARCH="$ARCH" "${TC[@]}" olddefconfig

          # Фильтруем нежелательные флаги из KCFLAGS и гарантируем порядок OPT_FLAGS в конце
          FILTERED_KCFLAGS=$(python3 - << 'PYEOF'
          import os, shlex

          warn_flags = shlex.split(os.environ.get("WARN_FLAGS", ""))
          opt_flags = shlex.split(os.environ.get("OPT_FLAGS", ""))
          remove_set = set(shlex.split(os.environ.get("REMOVE_FLAGS", "")))

          combined = [f for f in (warn_flags + opt_flags) if f not in remove_set]
          # Убираем дубликаты с сохранением порядка, оставляя последнее вхождение
          seen = set()
          dedup_rev = []
          for f in reversed(combined):
              if f not in seen:
                  seen.add(f)
                  dedup_rev.append(f)
          final_flags = list(reversed(dedup_rev))
          print(shlex.join(final_flags))
          PYEOF
          )

          # Если нужно также вычистить флаги напрямую из Makefile / arch/arm64/Makefile
          python3 - << 'PYEOF'
          import os, shlex

          remove_list = shlex.split(os.environ.get("REMOVE_FLAGS", ""))
          if remove_list:
              for path in ("Makefile", "arch/arm64/Makefile"):
                  if os.path.isfile(path):
                      with open(path, "r") as f:
                          text = f.read()
                      for flag in remove_list:
                          # Удаляем флаг как отдельное слово
                          text = text.replace(f" {flag} ", " ")
                          text = text.replace(f" {flag}\n", "\n")
                      with open(path, "w") as f:
                          f.write(text)
          PYEOF

          grep -E '^CONFIG_(LTO|CC_OPTIMIZE|HZ|KSU|BFQ|BBR|FQ_CODEL|SCHED_NEXT_BUDDY)' out/.config || true
          grep -E '^CONFIG_KSU=y$|^CONFIG_KSU_MANUAL_HOOK=y$' out/.config || true

          make -j"$(nproc)" O=out ARCH="$ARCH" "${TC[@]}" \
            KCFLAGS="$FILTERED_KCFLAGS" \
            Image.gz-dtb

          ccache -s

      - name: Report
        run: |
          set -uo pipefail
          export PATH="$CLANG_DIR/bin:$PATH"
          IMAGE="out/arch/$KERNEL_ARCH/boot/Image.gz-dtb"
          CMD="out/kernel/sched/.core.o.cmd"

          flags() { tr ' ' '\n' < "$CMD" 2>/dev/null; }

          has() { grep -q "^CONFIG_$1=y$" out/.config 2>/dev/null && echo "y" || echo "-"; }

          {
            echo "=== BUILD ==="
            date -u "+%Y-%m-%d %H:%M:%S UTC"
            echo "tag=${BUILD_TAG:-} arch=${KERNEL_ARCH:-} defconfig=${KERNEL_DEFCONFIG:-}"
            clang --version 2>/dev/null | head -n1
            ld.lld --version 2>/dev/null | head -n1
            echo "OPT_FLAGS=${OPT_FLAGS:-}"
            echo "REMOVE_FLAGS=${REMOVE_FLAGS:-}"
            echo "LINK_FLAGS=${LINK_FLAGS:-}"

            echo ""
            echo "=== SIZE (главная метрика) ==="
            if [ -f out/vmlinux ]; then
              ls -l out/vmlinux | awk '{print "vmlinux bytes: "$5}'
              if command -v llvm-size >/dev/null 2>&1; then
                llvm-size out/vmlinux
              elif command -v size >/dev/null 2>&1; then
                size out/vmlinux
              else
                readelf -S out/vmlinux 2>/dev/null | awk '
                  /\.text|\.rodata|\.data|\.bss/ {
                    getline; print prev, $0
                  } {prev=$0}'
              fi
            fi
            [ -f "$IMAGE" ] && { ls -l "$IMAGE" | awk '{print "Image.gz-dtb bytes: "$5}'; sha256sum "$IMAGE"; }

            echo ""
            echo "=== LLVM TUNING (значения, не наличие) ==="
            if [ -f "$CMD" ]; then
              flags | grep -A1 '^-mllvm$' | grep -v '^-mllvm$' | grep -v '^--$' \
                | sort | uniq -c | sort -rn
            else
              echo "$CMD not found"
            fi
            echo "--- пороги в исходниках ---"
            grep -Hn 'inline-threshold\|inlinehint-threshold\|unroll-threshold' \
              Makefile mm/Makefile kernel/sched/Makefile 2>/dev/null

            echo ""
            echo "=== OPT FLAGS ORDER (последний побеждает) ==="
            if [ -f "$CMD" ]; then
              flags | grep -nE '^-O[0-3s]$|^-f(no-)?omit-frame-pointer$|^-fno-optimize-sibling-calls$|^-f(no-)?stack-protector|^-f(no-)?common$|^-falign-functions|^-mcpu=|^-mtune=|^-march=|^-flto'
            fi

            echo ""
            echo "=== IR ATTRIBUTES ==="
            llvm-dis -o - out/kernel/sched/core.o 2>/dev/null \
              | grep -m1 'attributes #0' \
              | tr ' ' '\n' | grep -E 'target-cpu|target-features|frame-pointer|disable-tail-calls|ssp|unsafe-fp' || true

            echo ""
            echo "=== CONFIG: то, что ломалось ==="
            for s in FRAME_POINTER ARCH_WANT_FRAME_POINTERS STACKPROTECTOR STACKPROTECTOR_STRONG \
                     IKCONFIG IKCONFIG_PROC DEBUG_KERNEL DEBUG_SECTION_MISMATCH \
                     INLINE_OPTIMIZATION LLVM_POLLY REFCOUNT_FULL \
                     INIT_STACK_NONE INIT_STACK_ALL_ZERO INIT_ON_ALLOC_DEFAULT_ON INIT_ON_FREE_DEFAULT_ON \
                     SLAB_MERGE_DEFAULT SLAB_FREELIST_HARDENED SLAB_FREELIST_RANDOM \
                     KSM PSI TRANSPARENT_HUGEPAGE MEMCG HOTPLUG_CPU AUDIT \
                     TASKSTATS TASK_DELAY_ACCT BSD_PROCESS_ACCT UID_SYS_STATS \
                     LTO_CLANG THINLTO CC_OPTIMIZE_FOR_PERFORMANCE CC_OPTIMIZE_FOR_SIZE \
                     LD_DEAD_CODE_DATA_ELIMINATION RELR KALLSYMS_ALL \
                     HZ_300 PREEMPT NO_HZ_IDLE JUMP_LABEL FORCE_NR_CPUS \
                     IOSCHED_BFQ BFQ_DEFAULT BFQ_GROUP_IOSCHED MQ_IOSCHED_DEADLINE \
                     TCP_CONG_BBR DEFAULT_BBR NET_SCH_FQ_CODEL DEFAULT_FQ_CODEL DEFAULT_CAKE \
                     ZRAM ZRAM_DEF_COMP_LZ4 ZRAM_MULTI_COMP ZRAM_MEMORY_TRACKING ZRAM_WRITEBACK \
                     MTK_SCHED_EXTENSION MTK_SCHED_LB_ENHANCEMENT MTK_SCHED_CPU_PREFER \
                     KSU KSU_MANUAL_HOOK; do
              printf '%-38s %s\n' "$s" "$(has "$s")"
            done
            echo "HZ=$(grep -m1 '^CONFIG_HZ=' out/.config | cut -d= -f2)"

            echo ""
            echo "=== OPP: LL лестница ==="
            if [ -n "${OPP_TABLE:-}" ] && [ -f "$OPP_TABLE" ]; then
              for b in C62 C62LY C62D C62DLY; do
                echo "-- $b --"
                paste \
                  <(grep -oE "CPU_DVFS_FREQ[0-4]_LL_$b[[:space:]]+[0-9]+" "$OPP_TABLE" | awk '{print $2}') \
                  <(grep -oE "CPU_DVFS_VOLT[0-4]_VPROC_LL_$b[[:space:]]+[0-9]+" "$OPP_TABLE" | awk '{print $2}') \
                  | awk '{printf "%8s kHz  %6s (=%.5f V)\n", $1, $2, $2/100000}'
              done
              echo "-- L cluster stock (для сравнения потолка) --"
              grep -E 'CPU_DVFS_(FREQ0|VOLT0_VPROC)_L_C62[[:space:]]' "$OPP_TABLE"
            fi

            echo "=== LINK / ICF ==="
            tail -n3 arch/arm64/Makefile
            if [ -f build.log ]; then
              echo "icf-ignores: $(grep -c 'conservatively ignores SHT_LLVM_ADDRSIG' build.log || echo 0)"
              echo "COMMON symbols: $(grep -c 'is COMMON symbol' build.log || echo 0)"
              echo "unmet deps: $(grep -c 'unmet direct dependencies' build.log || echo 0)"
              grep -A3 'unmet direct dependencies' build.log | head -12 || true
            fi

            echo ""
            echo "=== CCACHE ==="
            ccache -s 2>/dev/null | grep -iE 'hits|misses|cache size' | head -8 || true

            echo ""
            echo "=== ERRORS / WARNINGS ==="
            if [ -f build.log ]; then
              echo "errors=$(grep -c 'error:' build.log || echo 0)  warnings=$(grep -c 'warning:' build.log || echo 0)"
              grep 'error:' build.log | head -20 || true
              echo "--- уникальные варнинги ---"
              grep -oE '\[-W[a-z-]+\]' build.log | sort | uniq -c | sort -rn | head -10 || true
            fi
          } | tee report.txt
          exit 0

      - name: Package
        run: |
          set -euo pipefail
          IMAGE=out/arch/$KERNEL_ARCH/boot/Image.gz-dtb
          test -s "$IMAGE"
          ls -l "$IMAGE"
          sha256sum "$IMAGE"

          git clone --depth=1 -b nadeko https://github.com/dre698/AnyKernel3.git anykernel
          cp "$IMAGE" anykernel/Image.gz-dtb
          cd anykernel
          rm -f zImage Image Image.gz
          rm -rf .git .github README.md

          cat > anykernel.sh << 'EOF'
          properties() { '
          kernel.string=Sashimi Kernel [O2 gc oc18]
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=blossom
          device.name2=dandelion
          device.name3=angelica
          device.name4=angelican
          device.name5=cattail
          device.name6=angelicain
          '; }
          BLOCK=auto;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          EOF

          zip -r9 "../Sashimi-$BUILD_TAG-$(date -u +%y%m%d-%H%M).zip" .

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sashimi-${{ env.BUILD_TAG }}-${{ github.run_number }}
          path: |
            Sashimi-*.zip
            report.txt
            build.log
            out/.config
          if-no-files-found: warn
          retention-days: 30
