name: Build Sashimi Kernel (blossom)

on:
  workflow_dispatch:
  push:
    branches: [ "Esd" ]

env:
  KERNEL_DEFCONFIG: blossom_defconfig
  KERNEL_ARCH: arm64

jobs:
  build:
    # СТРОГО 22.04! На 24.04+ нет пакета libncurses5-dev, который требуют скрипты MTK
    runs-on: ubuntu-22.04 

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          # Добавляем python-is-python3, так как скрипты MTK (DrvGen.py) часто вызывают 'python', а не 'python3'
          sudo apt-get install -y bc bison flex build-essential libssl-dev libelf-dev cpio kmod git zip curl ca-certificates jq \
            wget libffi-dev zlib1g-dev libreadline-dev libsqlite3-dev libbz2-dev libncurses5-dev libgdbm-dev liblzma-dev tk-dev python3 python-is-python3

      - name: Configure git
        run: |
          git config --global http.sslVerify false
          git config --global url."https://".insteadOf git://

      - name: Clone Toolchains (crDroid Clang + LineageOS GCC)
        run: |
          echo "Cloning crdroid Clang (AOSP compatible)..."
          git clone --depth=1 https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r428724.git /tmp/clang

          echo "Cloning GCC ARM64 (для легаси MTK)..."
          GIT_SSL_NO_VERIFY=1 git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git /tmp/gcc-aarch64

          echo "Cloning GCC ARM32 (для 32-битных бинарников в ядре)..."
          GIT_SSL_NO_VERIFY=1 git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git /tmp/gcc-arm

      - name: Verify Toolchains
        run: |
          /tmp/clang/bin/clang --version
          /tmp/gcc-aarch64/bin/aarch64-linux-android-gcc --version
          /tmp/gcc-arm/bin/arm-linux-androideabi-gcc --version

      - name: Build Kernel
        run: |
          export PATH="/tmp/clang/bin:/tmp/gcc-aarch64/bin:/tmp/gcc-arm/bin:${PATH}"

          export ARCH=${KERNEL_ARCH}
          export CROSS_COMPILE="aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="arm-linux-androideabi-"
          export CC="clang"
          export CLANG_TRIPLE="aarch64-linux-gnu-"

          echo "⚙️ Генерация .config из ${KERNEL_DEFCONFIG}..."
          make O=out ARCH=${ARCH} ${KERNEL_DEFCONFIG}
          
          echo "🔍 Проверка наличия KernelSU в сгенерированном .config..."
          if grep -q "CONFIG_KSU=y" out/.config && grep -q "CONFIG_KSU_MANUAL_HOOK=y" out/.config; then
            echo "✅ KernelSU успешно активирован в конфиге!"
          else
            echo "⚠️ ВНИМАНИЕ: KernelSU отсутствует или отключен в .config. Сборка продолжится, но KSU не будет работать."
          fi

          echo "🚀 Начало компиляции ядра..."
          # KCFLAGS="-Wno-unknown-warning-option" заставляет Clang игнорировать 
          # специфичные для GCC флаги из Makefile'ов драйверов (GPU, Wi-Fi и т.д.).
          # Это НЕ скрывает настоящие ошибки C-кода, а лишь убирает ругань на незнакомые флаги.
          make -j$(nproc) \
            O=out \
            ARCH=${ARCH} \
            CC=clang \
            CLANG_TRIPLE=${CLANG_TRIPLE} \
            CROSS_COMPILE=${CROSS_COMPILE} \
            CROSS_COMPILE_ARM32=${CROSS_COMPILE_ARM32} \
            KCFLAGS="-Wno-unknown-warning-option" \
            2>&1 | tee build.log

      - name: Verify Output
        run: |
          echo "🔎 Поиск скомпилированного образа ядра..."
          if [ -f "out/arch/${KERNEL_ARCH}/boot/Image.gz-dtb" ]; then
            echo "✅ Успешно собран: Image.gz-dtb"
          elif [ -f "out/arch/${KERNEL_ARCH}/boot/Image.gz" ]; then
            echo "✅ Успешно собран: Image.gz"
          else
            echo "❌ Образ ядра не найден! Проверь build.log"
            exit 1
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sashimi-kernel-blossom-${{ github.sha }}
          path: |
            out/arch/${{ env.KERNEL_ARCH }}/boot/Image.gz-dtb
            out/arch/${{ env.KERNEL_ARCH }}/boot/Image.gz
            out/.config
            build.log
          retention-days: 14
