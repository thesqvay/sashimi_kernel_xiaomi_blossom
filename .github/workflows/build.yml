name: Build Sashimi Kernel (blossom)

on:
  workflow_dispatch:

env:
  KERNEL_DEFCONFIG: blossom_defconfig
  KERNEL_ARCH: arm64
  LLVM_VERSION: "23.1.0"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y bc bison flex build-essential libssl-dev libelf-dev cpio kmod git zip curl ca-certificates jq \
            wget xz-utils libffi-dev zlib1g-dev libreadline-dev libsqlite3-dev libbz2-dev libncurses5-dev libgdbm-dev liblzma-dev tk-dev python3 python-is-python3

      - name: Configure git
        run: |
          git config --global http.sslVerify false
          git config --global url."https://".insteadOf git://

      - name: Download ClangBuiltLinux Toolchain (Clang + LLD)
        run: |
          echo "Downloading ClangBuiltLinux ${{ env.LLVM_VERSION }} ..."
          mkdir -p /tmp/clang-tc
          curl -LSs "https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-${{ env.LLVM_VERSION }}-x86_64.tar.xz" \
            | tar -xJ -C /tmp/clang-tc

          CLANG_BIN=""
          for c in $(find /tmp/clang-tc \( -type f -o -type l \) -name clang -perm -u+x); do
            d=$(dirname "$c")
            if [ -e "$d/ld.lld" ]; then CLANG_BIN="$d"; break; fi
          done
          if [ -z "$CLANG_BIN" ]; then
            echo "❌ Не найден исполняемый clang рядом с ld.lld!"
            find /tmp/clang-tc -maxdepth 3 | head -n 40
            exit 1
          fi
          chmod -R u+rx "$CLANG_BIN"
          echo "CLANG_BIN=$CLANG_BIN" >> $GITHUB_ENV
          echo "✅ Clang bin: $CLANG_BIN"
          ls -la "$CLANG_BIN/clang" "$CLANG_BIN/ld.lld"

      - name: Clone LineageOS GCC toolchains
        run: |
          echo "Cloning GCC ARM64..."
          GIT_SSL_NO_VERIFY=1 git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git /tmp/gcc-aarch64
          echo "Cloning GCC ARM32..."
          GIT_SSL_NO_VERIFY=1 git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git /tmp/gcc-arm

      - name: Verify Toolchains
        run: |
          "${{ env.CLANG_BIN }}/clang" --version
          "${{ env.CLANG_BIN }}/ld.lld" --version
          echo 'int main(void){return 0;}' > /tmp/t.c
          "${{ env.CLANG_BIN }}/clang" /tmp/t.c -o /tmp/t && /tmp/t
          echo "✅ host-компиляция clang работает"
          /tmp/gcc-aarch64/bin/aarch64-linux-android-gcc --version
          /tmp/gcc-arm/bin/arm-linux-androideabi-gcc --version

      - name: Build Kernel
        run: |
          export PATH="${{ env.CLANG_BIN }}:/tmp/gcc-aarch64/bin:/tmp/gcc-arm/bin:${PATH}"
          TC="${{ env.CLANG_BIN }}"

          export ARCH=${KERNEL_ARCH}
          export CROSS_COMPILE="aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="arm-linux-androideabi-"
          export CLANG_TRIPLE="aarch64-linux-gnu-"

          export CC="$TC/clang"
          export LD="$TC/ld.lld"
          export AR="$TC/llvm-ar"
          export NM="$TC/llvm-nm"
          export STRIP="$TC/llvm-strip"
          export OBJCOPY="$TC/llvm-objcopy"
          export OBJDUMP="$TC/llvm-objdump"
          export OBJSIZE="$TC/llvm-size"
          export READELF="$TC/llvm-readelf"
          export HOSTCC="$TC/clang"
          export HOSTCXX="$TC/clang++"
          export HOSTLD="$TC/ld.lld"
          export HOSTAR="$TC/llvm-ar"

          echo "⚙️ Генерация .config из ${KERNEL_DEFCONFIG}..."
          make O=out ARCH=${ARCH} ${KERNEL_DEFCONFIG}

          echo "🔍 Проверка наличия KernelSU в сгенерированном .config..."
          if grep -q "CONFIG_KSU=y" out/.config && grep -q "CONFIG_KSU_MANUAL_HOOK=y" out/.config; then
            echo "✅ KernelSU успешно активирован в конфиге!"
          else
            echo "⚠️ ВНИМАНИЕ: KernelSU отсутствует или отключен в .config."
          fi

          echo "🚀 Начало компиляции ядра (ClangBuiltLinux ${{ env.LLVM_VERSION }})..."
          make -j$(nproc) \
            O=out \
            ARCH=${ARCH} \
            CC="$TC/clang" \
            LD="$TC/ld.lld" \
            AR="$TC/llvm-ar" \
            NM="$TC/llvm-nm" \
            STRIP="$TC/llvm-strip" \
            OBJCOPY="$TC/llvm-objcopy" \
            OBJDUMP="$TC/llvm-objdump" \
            OBJSIZE="$TC/llvm-size" \
            READELF="$TC/llvm-readelf" \
            HOSTCC="$TC/clang" \
            HOSTCXX="$TC/clang++" \
            HOSTLD="$TC/ld.lld" \
            HOSTAR="$TC/llvm-ar" \
            CLANG_TRIPLE=${CLANG_TRIPLE} \
            CROSS_COMPILE=${CROSS_COMPILE} \
            CROSS_COMPILE_ARM32=${CROSS_COMPILE_ARM32} \
            KCFLAGS="-fcommon -Wno-unknown-warning-option -Wno-error=implicit-function-declaration -Wno-error=implicit-int -Wno-error=int-conversion -Wno-error=incompatible-function-pointer-types" \
            2>&1 | tee build.log

     - name: Verify Output
  run: |
    echo "🔎 Содержимое каталога ядра:"
    find out/arch/${KERNEL_ARCH}/boot -maxdepth 2 -type f -printf '%p (%s bytes)\n'

    echo "🔎 Поиск скомпилированного образа ядра..."

    if [ -s "out/arch/${KERNEL_ARCH}/boot/Image.gz-dtb" ]; then
      echo "KERNEL_IMAGE=Image.gz-dtb" >> $GITHUB_ENV
    elif [ -s "out/arch/${KERNEL_ARCH}/boot/Image.gz" ]; then
      echo "KERNEL_IMAGE=Image.gz" >> $GITHUB_ENV
    elif [ -s "out/arch/${KERNEL_ARCH}/boot/Image" ]; then
      echo "KERNEL_IMAGE=Image" >> $GITHUB_ENV
    else
      echo "❌ Образ ядра не найден!"
      echo "Проверяем наличие vmlinux:"
      ls -lh out/vmlinux || true
      exit 1
    fi

    echo "✅ Найден образ: $KERNEL_IMAGE"

      - name: Package AnyKernel3 Flashable ZIP
        run: |
          git clone -b nadeko --depth=1 https://github.com/dre698/AnyKernel3.git anykernel
          cd anykernel
          rm -f zImage Image.gz Image.gz-dtb *.dtb

          if [ -f "../out/arch/${{ env.KERNEL_ARCH }}/boot/Image.gz-dtb" ]; then
            cp ../out/arch/${{ env.KERNEL_ARCH }}/boot/Image.gz-dtb Image.gz-dtb
            echo "✓ Скопирован Image.gz-dtb"
          elif [ -f "../out/arch/${{ env.KERNEL_ARCH }}/boot/Image.gz" ]; then
            cp ../out/arch/${{ env.KERNEL_ARCH }}/boot/Image.gz Image.gz
            echo "✓ Скопирован Image.gz"
          fi

          cat > anykernel.sh << 'EOF'
          properties() { '
          kernel.string=Sashimi Kernel
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=blossom
          device.name2=dandelion
          device.name3=angelica
          device.name4=angelican
          device.name5=cattail
          device.name6=angelicain
          '; }
          BLOCK=auto;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          EOF

          rm -rf .git README.md .github *placeholder*
          ZIP_NAME="Sashimi-Kernel-blossom-$(date +%y%m%d-%H%M).zip"
          zip -r9 "../$ZIP_NAME" *
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload Flashable ZIP (Для прошивки)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 30

      - name: Upload Raw Files (Для отладки)
        uses: actions/upload-artifact@v4
        with:
          name: raw-kernel-files
          path: |
            out/arch/${{ env.KERNEL_ARCH }}/boot/Image.gz-dtb
            out/arch/${{ env.KERNEL_ARCH }}/boot/Image.gz
            out/.config
            build.log
          retention-days: 7
