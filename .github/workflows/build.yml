name: Build Sashimi Kernel (blossom)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_DEFCONFIG: blossom_defconfig
  KERNEL_ARCH: arm64
  CCACHE_DIR: /home/runner/.ccache

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Prepare KernelSU submodule
        run: |
          set -euo pipefail
          git submodule update --init --recursive
          git -C KernelSU fetch --tags --force
          git -C KernelSU checkout v4.2.0-rc3
          test -f drivers/kernelsu/Kconfig || { echo "ERROR: kernelsu Kconfig missing"; exit 1; }
          echo "KernelSU at: $(git -C KernelSU rev-parse --short HEAD)"

      - name: Install Dependencies
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex build-essential libssl-dev libelf-dev cpio \
            git zip curl ca-certificates xz-utils ccache python3

      - name: Clone Proton Clang
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git /tmp/proton-clang
          /tmp/proton-clang/bin/clang --version
          /tmp/proton-clang/bin/ld.lld --version

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-

      - name: Set -O2 optimization
        run: |
          set -euo pipefail
          sed -i 's/^OPT_FLAGS[[:space:]]*:=.*$/OPT_FLAGS := -O2 -march=armv8-a+crc+crypto/' Makefile
          grep -n "OPT_FLAGS" Makefile

      - name: Build Kernel
        run: |
          set -euo pipefail
          export PATH="/tmp/proton-clang/bin:$PATH"
          export ARCH="$KERNEL_ARCH"
          export CROSS_COMPILE="aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export CCACHE_COMPILERCHECK=content
          export CCACHE_CPP2=yes
          export CCACHE_SLOPPINESS=time_macros,locale,file_macro
          ccache -M 5G
          ccache -z

          MAKE_TC=(CC="ccache clang" LD=ld.lld AR=llvm-ar NM=llvm-nm STRIP=llvm-strip
                   OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump OBJSIZE=llvm-size READELF=llvm-readelf
                   HOSTCC=clang HOSTCXX=clang++
                   CLANG_TRIPLE="$CLANG_TRIPLE"
                   CROSS_COMPILE="$CROSS_COMPILE" CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32")

          echo "=== Sashimi | Proton Clang | -O2 ==="
          make O=out ARCH="$ARCH" "${MAKE_TC[@]}" "$KERNEL_DEFCONFIG"
          test -s out/.config || { echo "ERROR: .config not generated"; exit 1; }
          grep -E '^CONFIG_KSU=y$|^CONFIG_KSU_MANUAL_HOOK=y$' out/.config || echo "WARNING: KSU not enabled"

          make -j"$(nproc)" O=out ARCH="$ARCH" "${MAKE_TC[@]}" \
            KCFLAGS="-fcommon -Wno-unknown-warning-option -Wno-error=implicit-function-declaration -Wno-error=implicit-int -Wno-error=int-conversion -Wno-error=incompatible-function-pointer-types" \
            Image.gz-dtb 2>&1 | tee build.log

          ccache -s

      - name: Verify Output
        run: |
          set -euo pipefail
          BOOT_DIR="out/arch/${KERNEL_ARCH}/boot"
          if [ -s "$BOOT_DIR/Image.gz-dtb" ]; then KERNEL_IMAGE="Image.gz-dtb"
          elif [ -s "$BOOT_DIR/Image.gz" ]; then KERNEL_IMAGE="Image.gz"
          elif [ -s "$BOOT_DIR/Image" ]; then KERNEL_IMAGE="Image"
          else echo "ERROR: no kernel image"; tail -n 100 build.log; exit 1; fi
          echo "KERNEL_IMAGE=$KERNEL_IMAGE" >> "$GITHUB_ENV"

      - name: Package AnyKernel3
        id: package
        run: |
          set -euo pipefail
          git clone --depth=1 -b nadeko https://github.com/dre698/AnyKernel3.git anykernel
          cd anykernel
          rm -f zImage Image Image.gz Image.gz-dtb
          cp "../out/arch/${KERNEL_ARCH}/boot/${KERNEL_IMAGE}" "$KERNEL_IMAGE"
          cat > anykernel.sh << 'EOF'
          properties() { '
          kernel.string=Sashimi Kernel
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=blossom
          device.name2=dandelion
          device.name3=angelica
          device.name4=angelican
          device.name5=cattail
          device.name6=angelicain
          '; }
          BLOCK=auto;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          EOF
          rm -rf .git README.md .github *placeholder*
          ZIP_NAME="Sashimi-Kernel-blossom-$(date -u +%y%m%d-%H%M).zip"
          zip -r9 "../$ZIP_NAME" .
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.ZIP_NAME }}
          path: ${{ steps.package.outputs.ZIP_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Raw Files
        uses: actions/upload-artifact@v4
        with:
          name: raw-kernel-files
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/vmlinux
            out/.config
            build.log
          if-no-files-found: warn
          retention-days: 7
