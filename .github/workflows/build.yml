name: Build MTK Kernel (blossom)

on:
  workflow_dispatch:
  push:
    branches: [ "Esd" ]

env:
  KERNEL_DEFCONFIG: blossom_defconfig
  KERNEL_ARCH: arm64

jobs:
  build:
    # СТРОГО 22.04! На 24.04+ нет нужных пакетов libncurses5-dev
    runs-on: ubuntu-22.04 

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y bc bison flex build-essential libssl-dev libelf-dev cpio kmod git zip curl ca-certificates jq \
            wget libffi-dev zlib1g-dev libreadline-dev libsqlite3-dev libbz2-dev libncurses5-dev libgdbm-dev liblzma-dev tk-dev

      - name: Configure git
        run: |
          git config --global http.sslVerify false
          git config --global url."https://".insteadOf git://

      - name: Clone Toolchains (crDroid Clang + LineageOS GCC)
        run: |
          echo "Cloning crdroid Clang..."
          git clone --depth=1 https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r428724.git /tmp/clang

          echo "Cloning GCC ARM64..."
          GIT_SSL_NO_VERIFY=1 git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git /tmp/gcc-aarch64

          echo "Cloning GCC ARM32..."
          GIT_SSL_NO_VERIFY=1 git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git /tmp/gcc-arm

      - name: Verify Toolchains
        run: |
          /tmp/clang/bin/clang --version
          /tmp/gcc-aarch64/bin/aarch64-linux-android-gcc --version
          /tmp/gcc-arm/bin/arm-linux-androideabi-gcc --version

      - name: Clean stale KernelSU placeholder
        run: |
          rm -rf KernelSU
          rm -f drivers/kernelsu
          echo "Done."

      - name: Integrate KernelSU (NadekoSU fork for MTK)
        run: |
          # Используем проверенный скрипт для blossom, адаптированный под старые ядра
          curl -LSs "https://raw.githubusercontent.com/dre698/NadekoSU/main/kernel/setup.sh" | bash

      - name: Build Kernel
        run: |
          export PATH="/tmp/clang/bin:/tmp/gcc-aarch64/bin:/tmp/gcc-arm/bin:${PATH}"

          export ARCH=${KERNEL_ARCH}
          export CROSS_COMPILE="aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="arm-linux-androideabi-"
          export CC="clang"
          export CLANG_TRIPLE="aarch64-linux-gnu-"

          echo "Running defconfig..."
          make O=out ARCH=${ARCH} ${KERNEL_DEFCONFIG}

          echo "Building kernel..."
          # Гибридная сборка: Clang компилирует C-код, GCC обрабатывает легаси и ассемблер
          make -j$(nproc) \
            O=out \
            ARCH=${ARCH} \
            CC=clang \
            CLANG_TRIPLE=${CLANG_TRIPLE} \
            CROSS_COMPILE=${CROSS_COMPILE} \
            CROSS_COMPILE_ARM32=${CROSS_COMPILE_ARM32} \
            Image.gz-dtb dtbo.img

      - name: Check KernelSU config
        if: success()
        run: |
          if grep -q "CONFIG_KSU=y" out/.config; then
            echo "✅ KernelSU (NadekoSU) успешно интегрирован в .config"
          else
            echo "⚠️ KernelSU отключен в .config (проверь Makefile драйверов)"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blossom-kernel-build
          path: |
            out/arch/${{ env.KERNEL_ARCH }}/boot/Image.gz-dtb
            out/arch/${{ env.KERNEL_ARCH }}/boot/dtbo.img
            out/.config
          retention-days: 7
