name: Build Sashimi Kernel (Redmi 9A / blossom)

on:
  push:
    branches: [ "Esd" ]
  workflow_dispatch:

env:
  DEVICE_CODENAME: blossom
  DEVICE_ARCH: arm64
  DEFCONFIG: blossom_defconfig
  TOOLCHAIN_URL: "https://github.com/kdrag0n/proton-clang/releases/download/15.0.0/proton-clang-15.0.0-linux-x86_64.tar.zst"
  KERNELSU_CONFIG_REQUIRED: "CONFIG_KSU=y CONFIG_KSU_MANUAL_HOOK=y"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: Esd
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick libncurses5 libncurses5-dev libssl-dev libxml2 libxml2-utils lzop make maven ninja-build pngcrush python3 rsync schedtool squashfs-tools wget xsltproc zip zlib1g-dev zstd
          # Устанавливаем утилиты для LLVM/LLD
          sudo apt-get install -y llvm lld clang
          mkdir -p $GITHUB_WORKSPACE/toolchain
          
      - name: Download Toolchain (Clang 15)
        run: |
          wget -q -O toolchain.tar.zst ${{ env.TOOLCHAIN_URL }}
          tar -xvf toolchain.tar.zst -C $GITHUB_WORKSPACE/toolchain --strip-components=1
          echo "$GITHUB_WORKSPACE/toolchain/bin" >> $GITHUB_PATH

      - name: Verify KernelSU Configuration
        run: |
          echo "🔍 Checking KernelSU parameters в ${{ env.DEFCONFIG }}..."
          for config in $KERNELSU_CONFIG_REQUIRED; do
            if grep -q "$config" arch/${{ env.DEVICE_ARCH }}/configs/${{ env.DEFCONFIG }}; then
              echo "✅ Найден: $config"
            else
              echo "❌ ОШИБКА: Отсутствует $config в defconfig!"
              exit 1
            fi
          done

      - name: Prepare Kernel (Make defconfig)
        run: |
          export ARCH=${{ env.DEVICE_ARCH }}
          export SUBARCH=${{ env.DEVICE_ARCH }}
          export CC=clang
          export CXX=clang++
          export LD=ld.lld
          export LLVM=1
          export LLVM_IAS=1
          make O=out ${{ env.DEFCONFIG }}

      - name: Smart Include Path Analyzer (Pre-build)
        run: |
          cat << 'EOF' > analyze_includes.py
          import os, re, subprocess, sys
          # Скрипт проверяет заголовки, специфичные для MTK, чтобы предупредить о проблемах ДО компиляции
          critical_headers = ["dramc_io.h", "cmdq_engine.h", "modem_cldma_events.h"]
          
          print("🔎 Сканирование дерева исходников на наличие MTK-заголовков...")
          for header in critical_headers:
              result = subprocess.run(f"find . -name '{header}' -type f", shell=True, capture_output=True, text=True)
              paths = result.stdout.strip().split('\n')
              if paths and paths[0]:
                  print(f"✅ {header} найден в: {paths}")
                  # Здесь можно добавить автоматический патчинг Makefile, если путь один
              else:
                  print(f"⚠️  {header} НЕ НАЙДЕН в репозитории! Сборка упадет.")
          EOF
          python3 analyze_includes.py

      - name: Build Kernel
        id: build_kernel
        run: |
          export ARCH=${{ env.DEVICE_ARCH }}
          export SUBARCH=${{ env.DEVICE_ARCH }}
          export CC=clang
          export CXX=clang++
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export STRIP=llvm-strip
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export OBJSIZE=llvm-size
          export READELF=llvm-readelf
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1
          
          # Используем ccache для ускорения
          export USE_CCACHE=1
          ccache -M 50G
          
          # Ограничиваем параллелизм, чтобы избежать OOM на GitHub Runners
          make -j$(nproc --all) O=out \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            Image.gz-dtb dtbo.img
          
          if [ ! -f out/arch/${{ env.DEVICE_ARCH }}/boot/Image.gz-dtb ]; then
            echo "❌ Сборка не создала Image.gz-dtb!"
            exit 1
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sashimi-kernel-${{ env.DEVICE_CODENAME }}-${{ github.sha }}
          path: |
            out/arch/${{ env.DEVICE_ARCH }}/boot/Image.gz-dtb
            out/arch/${{ env.DEVICE_ARCH }}/boot/dtbo.img
            out/.config
          retention-days: 7

      - name: Post-Build KernelSU Check
        if: success()
        run: |
          echo "🔍 Финальная проверка .config на наличие KernelSU..."
          for config in $KERNELSU_CONFIG_REQUIRED; do
            if grep -q "$config" out/.config; then
              echo "✅ Подтверждено в итоговом .config: $config"
            else
              echo "❌ ВНИМАНИЕ: $config был выключен в процессе сборки (возможно, скрытая зависимость)!"
            fi
          done
